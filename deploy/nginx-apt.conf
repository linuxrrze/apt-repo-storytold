server {
    listen 80;
    listen [::]:80;
    # listen 443 ssl; ... (recommended, e.g. via certbot)
    server_name apt.example.org;

    root /srv/apt/storytold;
    autoindex on;

    # Internal state (checksum cache) is not for clients
    location ~ /\. { deny all; }

    # Indexes change on every run; packages never change once published
    location /dists/ { add_header Cache-Control "max-age=300"; }
    location /pool/  { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
